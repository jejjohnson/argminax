# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `uv run poe gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   type:*   — left to issue templates (NOT auto-applied on PRs)

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "*.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file: "tests/**"

# One area per public module: the public re-export and its private tree under _src.
"area:solve":
  - changed-files:
    - any-glob-to-any-file:
      - "src/argminax/solve.py"
      - "src/argminax/solve/**"
      - "src/argminax/_src/solve/**"

"area:curvature":
  - changed-files:
    - any-glob-to-any-file:
      - "src/argminax/curvature.py"
      - "src/argminax/curvature/**"
      - "src/argminax/_src/curvature/**"

"area:diagnose":
  - changed-files:
    - any-glob-to-any-file:
      - "src/argminax/diagnose.py"
      - "src/argminax/diagnose/**"
      - "src/argminax/_src/diagnose/**"

"area:adjoint":
  - changed-files:
    - any-glob-to-any-file:
      - "src/argminax/adjoint.py"
      - "src/argminax/adjoint/**"
      - "src/argminax/_src/adjoint/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
