name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      # A release that bumps pyproject.toml without uv.lock leaves the lockfile
      # stale; catch it on every PR (the release PR is checked in
      # release-please.yml, since GitHub starts no workflows for it).
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install lint dependencies
        run: uv sync --locked --group lint
      - name: Run ruff check
        run: uv run --group lint ruff check .
      - name: Run ruff format check
        run: uv run --group lint ruff format --check .
